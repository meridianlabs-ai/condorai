[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "condorai"
dynamic = ["version"]
description = "AI Analysis"
authors = [{ name = "Meridian Labs" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT License" }
dependencies = ["typing_extensions>=4.9.0"]

[project.urls]
"Source Code" = "https://github.com/meridianlabs-ai/condorai"
"Issue Tracker" = "https://github.com/meridianlabs-ai/condorai/issues"


[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "anthropic",
    "openai",
    "pytest-dotenv",
    "pyyaml",
    "tomli; python_version < '3.11'",
    "types-PyYAML",
]

[tool.uv]
# 0.11.8 is the first uv that keeps uv.lock stable with a relative exclude-newer,
# and 0.13.4 the first that no longer trusts the compromised emSign root
# (GHSA-hq85-5cpj-mr62).
required-version = ">=0.13.4"
# Only resolve releases at least 7 days old (see CONTRIBUTING.md).
exclude-newer = "7 days"

# 6 hours only for direct dependencies that are a model provider SDK or an
# Inspect package; see CONTRIBUTING.md.
[tool.uv.exclude-newer-package]
anthropic = "6 hours"
openai = "6 hours"

[tool.hatch.build]
only-packages = true
exclude = ["docs/", "tests/"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/condorai/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version" # Important for PyPI compatibility

[tool.ruff]
extend-exclude = ["docs"]
src = ["."]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # flake8
    "D",      # pydocstyle
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM101", # duplicate isinstance
    # "RET", # flake8-return
    # "RUF", # ruff rules
]
ignore = ["E203", "E501", "D10", "D212", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
