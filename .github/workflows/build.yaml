name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

jobs:
  py-ruff:
    runs-on: ubuntu-latest
    env:
      # Dependencies must install from wheels; only condorai is built.
      UV_NO_BUILD: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: meridianlabs-ai/actions/install-python-dependencies@330f3df6492418d6b25dc2631fc31143489f4674 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Lint with Ruff
        run: uv run --no-sync ruff check
      - name: Format with Ruff
        run: uv run --no-sync ruff format --check
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-mypy:
    runs-on: ubuntu-latest
    env:
      # Dependencies must install from wheels; only condorai is built.
      UV_NO_BUILD: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: meridianlabs-ai/actions/install-python-dependencies@330f3df6492418d6b25dc2631fc31143489f4674 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Run mypy
        run: uv run --no-sync mypy src
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-test:
    runs-on: ubuntu-latest
    env:
      # Dependencies must install from wheels; only condorai is built.
      UV_NO_BUILD: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: meridianlabs-ai/actions/install-python-dependencies@330f3df6492418d6b25dc2631fc31143489f4674 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-build:
    runs-on: ubuntu-latest
    env:
      # Dependencies must install from wheels; only condorai is built.
      UV_NO_BUILD: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The build toolchain that publish.yaml uses, pinned with hashes. To
      # update the file, see publish.yaml.
      - name: Install build toolchain
        uses: meridianlabs-ai/actions/install-python-dependencies@330f3df6492418d6b25dc2631fc31143489f4674 # main
        with:
          versions: hashed-requirements
          python-version: ${{ matrix.python-version }}
          requirements-file: scripts/build-dist/requirements.txt
          package-format: wheels-only
          environment-dir: ${{ runner.temp }}/build-venv
          actions-cache: none
      - name: Build package
        id: build
        run: |
          "$RUNNER_TEMP/build-venv/bin/python" -m build --no-isolation
          wheels=(dist/*.whl)
          [ ${#wheels[@]} -eq 1 ] && [ -f "${wheels[0]}" ] || { echo "::error::expected one wheel in dist/"; exit 1; }
          # ./ marks a local path for the install action.
          echo "wheel=./${wheels[0]}" >> "$GITHUB_OUTPUT"
      # The locked runtime dependencies, without the project, then the wheel
      # with --no-deps. A second call in a job must use the first call's
      # actions-cache.
      - uses: meridianlabs-ai/actions/install-python-dependencies@330f3df6492418d6b25dc2631fc31143489f4674 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          project-install: skip
          also-install-without-deps: ${{ steps.build.outputs.wheel }}
          actions-cache: none
      - name: Verify package
        # -I leaves the working directory off sys.path and ignores PYTHON*
        # variables, so the import can only find the installed wheel.
        run: .venv/bin/python -I -c "import condorai; print('Package imported successfully')"
